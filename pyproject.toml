[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaggle-template"
version = "0.1.0"
description = "A modality-agnostic Kaggle competition template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "wandb>=0.18,<1",
]

[project.scripts]
kaggle-template = "kaggle_template.cli:app"

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_template", "src/competition"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kaggle_template", "competition"]
